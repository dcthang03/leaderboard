<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Card Scanner iPhone</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main class="app">
    <h1>Quet La Bai Tay</h1>
    <p class="sub">Mo camera sau iPhone, quet va xuat JSON de luu DB.</p>

    <section class="camera-wrap">
      <video id="video" playsinline muted></video>
      <canvas id="captureCanvas" hidden></canvas>
      <div class="guide">Dat goc tren trai cua la bai vao khung</div>
    </section>

    <section class="controls">
      <button id="startBtn">Bat camera sau</button>
      <button id="scanBtn" disabled>Quet la bai</button>
      <button id="stopBtn" disabled>Tat camera</button>
    </section>

    <p id="status" class="status">San sang.</p>

    <section class="result">
      <h2>Du lieu quet</h2>
      <pre id="jsonOutput">[]</pre>
    </section>
  </main>
</body>
</html>
